name: ecom-skill-quality
description: 文本质量抽检——真实读 SOP 原文生成提示词，用模型按该 SOP 硬规则评分；图片输出仍人工看
tags:
  suite: quality-sampling

# 生成与评分都走 DeepSeek 官方 provider，密钥只走环境变量或 CI Secret。
# 默认 deepseek-flash；关闭 thinking 让生成的提示词与评分 JSON 都保持稳定。
providers:
  - id: deepseek:deepseek-flash
    config:
      temperature: 0.2
      max_tokens: 2000
      passthrough:
        thinking:
          type: disabled

prompts:
  - file://./quality-prompt.js

tests: file://./quality-tests.js

defaultTest:
  options:
    provider:
      id: deepseek:deepseek-flash
      config:
        passthrough:
          thinking:
            type: disabled

evaluateOptions:
  maxConcurrency: 2
  repeat: 1
