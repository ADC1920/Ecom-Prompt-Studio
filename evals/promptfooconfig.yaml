name: ecom-skill-routing
description: 电商提示词技能触发回归——断言 22 条提示各自命中正确的技能与 SOP
tags:
  suite: trigger-routing

# 模型通过 DeepSeek 官方 provider 接入：DEEPSEEK_API_KEY 只走环境变量或 CI Secret。
# 默认 deepseek-flash，关闭 thinking 以保证路由 JSON 输出稳定；
# 需要更强推理时把下面一行改成 deepseek:deepseek-v4-pro。
providers:
  - id: deepseek:deepseek-flash
    config:
      temperature: 0
      max_tokens: 400
      passthrough:
        thinking:
          type: disabled

prompts:
  - file://./router.js

tests: file://./gen_tests.js

evaluateOptions:
  maxConcurrency: 4
  repeat: 1
